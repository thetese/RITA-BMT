<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>Rita - Mobile Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      padding-bottom: 70px; /* Space for bottom nav */
    }
    
    /* Header */
    .header {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      padding: 16px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .header h1 { margin: 0; font-size: 1.2rem; font-weight: 600; letter-spacing: 0.5px; }

    /* Layout */
    .container { padding: 16px; display: none; }
    .container.active { display: block; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* Cards */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
      border: 1px solid var(--border);
    }
    .card h2 { margin-top: 0; font-size: 0.95rem; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
    .value { font-size: 2.2rem; font-weight: 800; margin: 8px 0 0 0; }
    .value.money { color: var(--success); }

    /* Lists */
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .list-item:last-child { border-bottom: none; padding-bottom: 0; }
    .list-title { font-weight: 600; font-size: 1rem; }
    .list-subtitle { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
    .list-right { text-align: right; font-weight: 700; }
    .badge-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 10px rgba(0,0,0,0.2);
      z-index: 100;
    }
    .nav-item {
      color: var(--text-muted);
      text-align: center;
      font-size: 0.75rem;
      cursor: pointer;
      flex: 1;
      padding: 4px;
    }
    .nav-item.active { color: var(--primary); }
    .nav-icon { font-size: 1.4rem; display: block; margin-bottom: 4px; }

    /* Misc */
    .refresh-btn {
      width: 100%; padding: 14px; background: var(--primary); color: white; border: none;
      border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px;
    }
    #loading { text-align: center; color: var(--text-muted); margin-top: 40px; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="headerTitle">Dashboard</h1>
  </div>
  
  <div id="loading">Loading Live Data...</div>

  <!-- DASHBOARD TAB -->
  <div class="container" id="tab-dashboard">
    <div class="card">
      <h2>Today's Revenue</h2>
      <p class="value money" id="totalSales">0 FRW</p>
    </div>
    <div class="card">
      <h2>Transactions Today</h2>
      <p class="value" id="transactions">0</p>
    </div>
    <button class="refresh-btn" onclick="fetchData()">🔄 Sync Now</button>
  </div>

  <!-- ACTIVITY TAB -->
  <div class="container" id="tab-activity">
    <div class="card">
      <h2>Recent Sales</h2>
      <div id="salesList">
        <div style="color: var(--text-muted); text-align: center; padding: 20px;">No sales yet.</div>
      </div>
    </div>
  </div>

  <!-- INVENTORY TAB -->
  <div class="container" id="tab-inventory">
    <div class="card">
      <h2>Low Stock Alerts</h2>
      <div id="inventoryList">
        <div style="color: var(--text-muted); text-align: center; padding: 20px;">All stock levels look good.</div>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('dashboard')">
      <span class="nav-icon">📊</span>
      Dashboard
    </div>
    <div class="nav-item" onclick="switchTab('activity')">
      <span class="nav-icon">🧾</span>
      Activity
    </div>
    <div class="nav-item" onclick="switchTab('inventory')">
      <span class="nav-icon">⚠️</span>
      Inventory
    </div>
  </div>

  <script>
    let currentTab = 'dashboard';

    function switchTab(tabId) {
      currentTab = tabId;
      // Update UI
      document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
      
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      event.currentTarget.classList.add('active');

      const titles = { dashboard: 'Dashboard', activity: 'Recent Activity', inventory: 'Inventory Alerts' };
      document.getElementById('headerTitle').innerText = titles[tabId];
      
      fetchData();
    }

    async function fetchData() {
      try {
        if (currentTab === 'dashboard') {
          const res = await fetch('/api/dashboard');
          const data = await res.json();
          document.getElementById('loading').style.display = 'none';
          document.getElementById('totalSales').innerText = data.totalSalesToday.toLocaleString() + ' FRW';
          document.getElementById('transactions').innerText = data.transactionsToday;
        } 
        else if (currentTab === 'activity') {
          const res = await fetch('/api/sales/recent');
          const data = await res.json();
          const list = document.getElementById('salesList');
          if(data.length === 0) return;
          list.innerHTML = data.map(sale => `
            <div class="list-item">
              <div>
                <div class="list-title">${sale.productName || 'Sale'}</div>
                <div class="list-subtitle">${new Date(sale.createdAt).toLocaleTimeString()}</div>
              </div>
              <div class="list-right money">+${sale.totalPrice.toLocaleString()}</div>
            </div>
          `).join('');
        }
        else if (currentTab === 'inventory') {
          const res = await fetch('/api/inventory/low-stock');
          const data = await res.json();
          const list = document.getElementById('inventoryList');
          if(data.length === 0) {
            list.innerHTML = '<div style="color: var(--success); text-align: center; padding: 20px;">All stock levels look good.</div>';
            return;
          }
          list.innerHTML = data.map(item => `
            <div class="list-item">
              <div>
                <div class="list-title">${item.name}</div>
                <div class="list-subtitle">Threshold: ${item.lowStockThreshold}</div>
              </div>
              <div class="list-right badge-danger">${item.stockQuantity} Left</div>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error("Fetch error:", err);
      }
    }
    
    // Init
    document.getElementById('tab-dashboard').classList.add('active');
    fetchData();
    setInterval(fetchData, 15000); // 15 sec auto-sync
  </script>
</body>
</html>
